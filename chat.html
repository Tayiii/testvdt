<!-- chat.html (версия: 1) перенос длинных ссылок 2) кликабельные ссылки 3) BACK по истории экранов) -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Чат-бот Водоканала</title>
<style>
  body { font-family: Arial, sans-serif; }

  #chat-toggle {
    position: fixed; bottom: 20px; right: 20px; background: white; border: none;
    padding: 5px; border-radius: 50%; cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.25);
    z-index: 1000;
  }
  #chat-toggle img { width: 60px; height: 60px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%{transform:translateY(0)} 50%{transform:translateY(-6px)} 100%{transform:translateY(0)} }

  .chat-hint {
    position: fixed; right: 95px; bottom: 40px; max-width: 260px; background: white;
    border-radius: 16px; padding: 10px 14px; font-size: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    cursor: pointer; z-index: 999; transition: opacity .3s ease, transform .3s ease;
  }
  .chat-hint::after {
    content: ""; position: absolute; right: -6px; bottom: 16px; width: 12px; height: 12px;
    background: white; transform: rotate(45deg);
  }
  .chat-hint.hidden { opacity: 0; pointer-events: none; transform: translateY(6px); }

  #chat-window {
    position: fixed; bottom: 100px; right: 20px; width: 380px; height: 560px; background: white;
    border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: none; flex-direction: column; overflow: hidden; z-index: 1000;
  }

  #chat-header {
    background: linear-gradient(135deg, #2c64b4, #3f89ff);
    color: white; padding: 12px; font-weight: bold; display:flex; align-items:center; gap:10px;
  }
  #chat-header img { width: 40px; height: 40px; }

  #chat {
    flex: 1; padding: 12px; overflow-y: auto; background: #f4f8ff; display:flex; flex-direction: column;
  }

  .message {
    margin: 8px 0;
    padding: 10px 12px;
    border-radius: 14px;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;

    /* чтобы длинные ссылки не вылезали за рамку */
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .user { background: #2c64b4; color: white; align-self: flex-end; }
  .bot { background: #e3e8f3; color: black; align-self: flex-start; }

  #quick-container {
    display:block; border-top: 1px solid #eee; background: #fff; padding: 10px 10px 6px;
  }
  #quick-content { display:block; }
  #quick-title { font-size: 12px; color: #666; margin: 0 2px 8px; }
  #quick-buttons { display:flex; flex-wrap:wrap; gap:6px; }

  .qbtn {
    background: #e3e8f3; border: none; padding: 8px 10px; border-radius: 15px;
    cursor: pointer; font-size: 13px;
  }
  .qbtn.secondary { background:#f0f0f0; }

  #chat-input { display:flex; border-top: 1px solid #ddd; }
  #msg { flex:1; border:none; padding: 10px; font-size: 14px; outline: none; }
  #send-btn { background:#2c64b4; color:white; border:none; padding: 10px 15px; cursor:pointer; }

  /* стиль для ссылок в сообщениях */
  .message a { color:#2c64b4; text-decoration: underline; }
/* Mobile-safe header + close button visibility */
#chat-header {
  min-height: 52px;
  box-sizing: border-box;
  flex: 0 0 auto;
  z-index: 2;
  padding-top: calc(12px + env(safe-area-inset-top));
}

#chat-title {
  display: block;
  min-width: 0;
  flex: 1;
  margin-left: 8px;
}

#chat-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 18px;
  line-height: 18px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 10px;
}

#chat-close:active { transform: scale(0.98); }

/* Prefer dynamic viewport height on mobile browsers */
@media (max-width: 600px) {
  #chat-window {
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    width: 100vw;
    height: 100dvh;
    height: 100vh; /* fallback */
    border-radius: 0;
  }
}


/* ===== Responsive size overrides (v4) ===== */
/* Desktop/tablet: restore floating window (override any global full-screen rules) */
@media (min-width: 601px) {
  #chat-window {
    left: auto !important;
    top: auto !important;
    right: 20px !important;
    bottom: 100px !important;
    width: 380px !important;
    height: 560px !important;
    border-radius: 15px !important;
  }
}

/* Mobile: smaller than full-screen, keep margins and always show input */
@media (max-width: 600px) {
  #chat-window {
    left: 12px !important;
    right: 12px !important;
    bottom: 12px !important;
    top: auto !important;
    width: calc(100vw - 24px) !important;
    height: calc(100dvh - 120px) !important;
    height: calc(100vh - 120px) !important; /* fallback */
    border-radius: 18px !important;
  }

  /* Prevent quick buttons from pushing input out of view */
  #quick-content {
    max-height: 30vh;
    overflow-y: auto;
  }

  #chat-input {
    flex: 0 0 auto;
  }
}

</style>
</head>
<body>

<button id="chat-toggle"><img src="/mascot.png" alt="Водоканал"></button>

<div id="chat-hint" class="chat-hint hidden">Могу ли я вам чем-то помочь?</div>

<div id="chat-window">
  <div id="chat-header">
    <img src="/mascot.png" alt="mascot">
    <span id="chat-title">Онлайн-помощник Водоканала</span>
    <button id="chat-close" aria-label="Закрыть чат" title="Закрыть">✕</button>
  </div>

  <div id="chat"></div>

  <div id="quick-container">
    <div id="quick-content">
      <div id="quick-title"></div>
      <div id="quick-buttons"></div>
    </div>

    <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;">
      <button id="btn-back" class="qbtn secondary" style="display:none;">◀ Назад</button>
      <button id="btn-cats" class="qbtn secondary">Категории</button>
    </div>
  </div>

  <div id="chat-input">
    <input id="msg" placeholder="Введите вопрос..." autocomplete="off"/>
    <button id="send-btn">Отправить</button>
  </div>
</div>

<script>
  const chatWindow = document.getElementById("chat-window");
  const toggleBtn = document.getElementById("chat-toggle");
  const chat = document.getElementById("chat");
  const input = document.getElementById("msg");
  const sendBtn = document.getElementById("send-btn");

  const chatHint = document.getElementById("chat-hint");

  const quickContainer = document.getElementById("quick-container");
  const quickContent = document.getElementById("quick-content");
  const quickTitle = document.getElementById("quick-title");
  const quickButtons = document.getElementById("quick-buttons");
  const btnBack = document.getElementById("btn-back");
  const btnCats = document.getElementById("btn-cats");

  // История экранов (заголовок + кнопки)
  let navStack = [];
  // Текущий экран кнопок (чтобы пушить в navStack перед переходом)
  let currentQuickReplies = [];

  let suppressNextBotAnswer = false;

  function normalizeVisiblePayload(p) {
    if (!p) return "";
    if (p.startsWith("faq:")) return "Выбрано: " + (p.split(":",2)[1] || "вопрос");
    if (p.startsWith("category:")) return "Категория";
    return p;
  }

  // превращаем "голые" URL в кликабельные ссылки,
  // но если в тексте уже есть <a ...>, ничего не меняем
  function linkify(text) {
    if (!text) return "";

    // Если в тексте уже есть HTML-ссылка — не трогаем, чтобы не сломать разметку
    if (/<a\b/i.test(text)) {
      return text;
    }

    const urlPattern = /(https?:\/\/[^\s]+)/g;
    return text.replace(urlPattern, (url) => {
      const safeUrl = url.replace(/"/g, "&quot;");
      return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${url}</a>`;
    });
  }

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.innerHTML = linkify(text);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showQuick(replies, title) {
    currentQuickReplies = replies || [];

    quickContent.style.display = "block";
    quickButtons.innerHTML = "";
    quickTitle.textContent = title || "";

    if (!replies || !replies.length) {
      quickContent.style.display = "none";
      currentQuickReplies = [];
      btnBack.style.display = navStack.length ? "inline-block" : "none";
      return;
    }

    replies.forEach(r => {
      const b = document.createElement("button");
      b.className = "qbtn";
      b.textContent = r.title;
      b.onclick = () => sendPayload(r.payload, r.title);
      quickButtons.appendChild(b);
    });

    btnBack.style.display = navStack.length ? "inline-block" : "none";
  }

  async function apiChat(body) {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    return await resp.json();
  }

  async function sendText() {
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    const data = await apiChat({message});
    handleResponse(data);
  }

  async function sendPayload(payload, labelForUser) {
    // сохраняем текущий экран в историю, чтобы "Назад" возвращал на предыдущий уровень
    const isRootRequest = (payload === "category:__root__");
    const hasScreen = (quickContent.style.display !== "none" && currentQuickReplies && currentQuickReplies.length);

    if (!isRootRequest && hasScreen) {
      navStack.push({
        title: quickTitle.textContent || "",
        quickReplies: currentQuickReplies
      });
    }

    addMessage(labelForUser || normalizeVisiblePayload(payload) || "Выбор", "user");
    const data = await apiChat({payload});
    handleResponse(data);
  }

  function handleResponse(data) {
    const shouldShowAnswer = !(suppressNextBotAnswer && data && data.quickTitle === "Категории");
    suppressNextBotAnswer = false;

    if (shouldShowAnswer && data && typeof data.answer === "string" && data.answer.length) {
      addMessage(data.answer, "bot");
    }

    if (data && Array.isArray(data.quickReplies) && data.quickReplies.length) {
      // ВАЖНО: больше не используем data.navPush (чтобы не было дублей),
      // т.к. историю ведём на фронте в sendPayload()
      showQuick(data.quickReplies, data.quickTitle || "");
    } else {
      quickContent.style.display = "none";
      currentQuickReplies = [];
      btnBack.style.display = navStack.length ? "inline-block" : "none";
    }
  }

  function openChat() {
    const opened = chatWindow.style.display === "flex";
    chatWindow.style.display = opened ? "none" : "flex";
    if (!opened) {
      hideHint();
      if (!sessionStorage.getItem("catsShown")) {
        sessionStorage.setItem("catsShown","1");
        requestCategories(true);
      }
    }
  }

  function hideHint() {
    chatHint.classList.add("hidden");
    localStorage.setItem("chatHintSeen","1");
  }

  toggleBtn.onclick = openChat;
  sendBtn.onclick = sendText;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendText(); });

  setTimeout(() => {
    if (chatWindow.style.display !== "flex" && !localStorage.getItem("chatHintSeen")) {
      chatHint.classList.remove("hidden");
    }
  }, 2000);

  chatHint.onclick = () => {
    chatWindow.style.display = "flex";
    hideHint();
    requestCategories(true);
  };

  // toggle категорий: скрываем/показываем только quick-content (кнопка остаётся)
  btnCats.onclick = async () => {
    const catsOpen = (quickContent.style.display !== "none" && quickTitle.textContent === "Категории");

    if (catsOpen) {
      quickContent.style.display = "none";
      currentQuickReplies = [];
      return;
    }

    navStack = [];
    await requestCategories(true);
  };

  btnBack.onclick = () => {
    const prev = navStack.pop();

    if (!prev) {
      requestCategories(true);
      return;
    }

    quickContent.style.display = "block";
    quickButtons.innerHTML = "";
    quickTitle.textContent = prev.title || "";

    currentQuickReplies = prev.quickReplies || [];

    currentQuickReplies.forEach(r => {
      const b = document.createElement("button");
      b.className = "qbtn";
      b.textContent = r.title;
      b.onclick = () => sendPayload(r.payload, r.title);
      quickButtons.appendChild(b);
    });

    btnBack.style.display = navStack.length ? "inline-block" : "none";
  };

  async function requestCategories(suppressBotAnswer = false) {
    suppressNextBotAnswer = !!suppressBotAnswer;
    const data = await apiChat({payload:"category:__root__"});
    navStack = [];
    quickContent.style.display = "block";
    handleResponse(data);
  }

  // init
  (async () => {
    try {
      const resp = await fetch("/api/hello");
      const data = await resp.json();
      addMessage((data && data.text) ? data.text : "Здравствуйте.", "bot");
    } catch (e) {
      addMessage("Здравствуйте. Выберите категорию вопросов или напишите ваш вопрос.", "bot");
    }
    quickContent.style.display = "none";
  })();


// Close button + swipe-down to close (mobile)
const closeBtn = document.getElementById("chat-close");

function hideChatWindow() {
  chatWindow.style.display = "none";
}

if (closeBtn) {
  closeBtn.addEventListener("click", () => {
    hideChatWindow();
  });
}

/* Swipe down to close (touch devices) */
let touchStartY = null;
let touchStartX = null;
let touchLastY = null;
let touchLastX = null;

function onTouchStart(e) {
  if (!e.touches || e.touches.length !== 1) return;
  touchStartY = e.touches[0].clientY;
  touchStartX = e.touches[0].clientX;
  touchLastY = touchStartY;
  touchLastX = touchStartX;
}

function onTouchMove(e) {
  if (touchStartY === null || !e.touches || e.touches.length !== 1) return;
  touchLastY = e.touches[0].clientY;
  touchLastX = e.touches[0].clientX;
}

function onTouchEnd() {
  if (touchStartY === null || touchStartX === null || touchLastY === null || touchLastX === null) {
    touchStartY = touchStartX = touchLastY = touchLastX = null;
    return;
  }

  const dy = touchLastY - touchStartY;
  const dx = touchLastX - touchStartX;
  const threshold = 90;

  // close only when swipe is mostly vertical and downwards
  if (dy > threshold && Math.abs(dy) > Math.abs(dx) * 1.5) {
    if (win.style.display !== "none") {
      hideChatWindow();
    }
  }

  touchStartY = touchStartX = touchLastY = touchLastX = null;
}

if (chatWindow) {
  chatWindow.addEventListener("touchstart", onTouchStart, { passive: true });
  chatWindow.addEventListener("touchmove", onTouchMove, { passive: true });
  chatWindow.addEventListener("touchend", onTouchEnd, { passive: true });
}
</script>
</body>
</html>
